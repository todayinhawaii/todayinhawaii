<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎈 Aloha Balloons — Today in Hawaii</title>
  <meta name="description" content="Pop colorful Hawaii balloons! Satisfying ASMR balloon popping game for all ages!">
  <link rel="icon" href="/icon-192.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

    body{
      background:linear-gradient(160deg,#061d2c 0%,#0a2e44 60%,#061d2c 100%);
      min-height:100vh;
      font-family:system-ui,sans-serif;
      overflow:hidden;
      user-select:none;
      -webkit-user-select:none;
    }

    /* Stars */
    .star{
      position:fixed;
      background:white;
      border-radius:50%;
      opacity:0;
      animation:twinkle ease-in-out infinite;
    }
    @keyframes twinkle{
      0%,100%{opacity:0.1;}
      50%{opacity:0.6;}
    }

    /* HUD */
    #hud{
      position:fixed;top:0;left:0;right:0;
      padding:10px 16px;
      display:flex;align-items:center;justify-content:space-between;
      z-index:100;
      background:rgba(6,29,44,0.8);
      backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,0.1);
    }
    .hud-score{font-size:22px;font-weight:900;color:#fbbf24;text-shadow:0 0 10px rgba(251,191,36,0.4);}
    .hud-mid{font-size:12px;font-weight:700;color:#e8f4f8;text-align:center;}
    .hud-timer{
      font-size:24px;font-weight:900;color:#22d3ee;
      min-width:44px;text-align:right;
    }
    .hud-timer.urgent{
      color:#ff4444!important;
      animation:timerPanic 0.5s ease-in-out infinite;
    }
    @keyframes timerPanic{
      0%,100%{transform:scale(1);}
      50%{transform:scale(1.5);text-shadow:0 0 16px rgba(255,0,0,0.9);}
    }

    /* Timer bar */
    #timerBar{
      position:fixed;top:52px;left:0;right:0;
      height:5px;background:rgba(255,255,255,0.08);z-index:100;
    }
    #timerFill{
      height:100%;
      background:linear-gradient(90deg,#22d3ee,#a78bfa);
      transition:width 0.1s linear;
      box-shadow:0 0 8px rgba(34,211,238,0.5);
    }

    /* Game canvas */
    #gameCanvas{
      position:fixed;inset:0;
      pointer-events:none;
      overflow:hidden;
    }
    #gameCanvas.active{pointer-events:all;}

    /* Balloon */
    .balloon{
      position:absolute;
      cursor:pointer;
      pointer-events:all;
      filter:drop-shadow(2px 6px 10px rgba(0,0,0,0.4));
      transition:transform 0.08s;
      display:flex;flex-direction:column;align-items:center;
    }
    .balloon:active{transform:scale(0.88)!important;}

    /* Points label ON balloon */
    .balloon-pts{
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-55%);
      font-size:clamp(12px,3vw,18px);
      font-weight:900;
      color:white;
      text-shadow:0 1px 4px rgba(0,0,0,0.6);
      pointer-events:none;
      z-index:2;
      white-space:nowrap;
    }

    /* Pop burst */
    .pop-ring{
      position:fixed;
      border-radius:50%;
      border:4px solid currentColor;
      pointer-events:none;
      z-index:999;
      animation:popRing 0.4s ease forwards;
    }
    @keyframes popRing{
      0%{transform:translate(-50%,-50%) scale(0);opacity:1;}
      100%{transform:translate(-50%,-50%) scale(2.5);opacity:0;}
    }

    /* Score popup */
    .score-pop{
      position:fixed;
      font-size:24px;font-weight:900;
      pointer-events:none;z-index:9999;
      animation:scoreFly 0.9s ease forwards;
      text-shadow:0 2px 8px rgba(0,0,0,0.5);
      transform:translate(-50%,-50%);
    }
    @keyframes scoreFly{
      0%{opacity:1;transform:translate(-50%,-50%) scale(1);}
      100%{opacity:0;transform:translate(-50%,-120%) scale(1.5);}
    }

    /* Round announcement */
    #roundAnnounce{
      position:fixed;inset:0;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      z-index:200;
      background:rgba(6,29,44,0.92);
      backdrop-filter:blur(6px);
    }
    #roundAnnounce.hidden{display:none;}
    .announce-emoji{
      font-size:90px;margin-bottom:12px;
      animation:announceBob 0.7s ease-in-out infinite alternate;
    }
    @keyframes announceBob{
      0%{transform:scale(1) translateY(0);}
      100%{transform:scale(1.12) translateY(-12px);}
    }
    .announce-title{
      font-size:clamp(22px,6vw,32px);font-weight:900;
      color:#e8f4f8;
      text-shadow:0 3px 12px rgba(0,0,0,0.5);
      margin-bottom:8px;text-align:center;padding:0 20px;
    }
    .announce-pts{
      font-size:18px;font-weight:700;
      margin-bottom:6px;text-align:center;
    }
    .announce-sub{
      font-size:15px;color:#7fb3c8;
      margin-bottom:28px;text-align:center;
    }
    .announce-btn{
      padding:16px 44px;border:none;border-radius:99px;
      font-size:17px;font-weight:900;cursor:pointer;
      font-family:inherit;letter-spacing:1px;
      color:#fff;
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
      animation:btnPulse 1.2s ease-in-out infinite;
    }
    @keyframes btnPulse{
      0%,100%{transform:scale(1);}
      50%{transform:scale(1.05);box-shadow:0 8px 32px rgba(0,0,0,0.5);}
    }

    /* Name screen */
    #nameScreen{
      position:fixed;inset:0;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      z-index:300;
      background:linear-gradient(160deg,#061d2c,#0a2e44);
    }
    .ns-card{
      background:rgba(10,46,68,0.9);
      border:1.5px solid rgba(255,255,255,0.1);
      border-radius:28px;padding:28px 24px;
      max-width:360px;width:90%;
      box-shadow:0 20px 60px rgba(0,0,0,0.4);
      text-align:center;
    }
    .ns-logo{font-size:64px;margin-bottom:8px;}
    .ns-title{font-size:24px;font-weight:900;color:#e8f4f8;margin-bottom:4px;}
    .ns-sub{font-size:13px;color:#7fb3c8;margin-bottom:20px;line-height:1.5;}
    .ns-input{
      width:100%;padding:12px;
      background:rgba(255,255,255,0.07);
      border:1.5px solid rgba(255,255,255,0.15);
      border-radius:12px;color:#e8f4f8;
      font-size:15px;font-family:inherit;
      outline:none;margin-bottom:10px;text-align:center;
    }
    .ns-input::placeholder{color:#7fb3c8;}
    .ns-select{
      width:100%;padding:12px;
      background:rgba(6,29,44,0.8);
      border:1.5px solid rgba(255,255,255,0.15);
      border-radius:12px;color:#e8f4f8;
      font-size:14px;font-family:inherit;
      outline:none;margin-bottom:16px;cursor:pointer;
    }
    .ns-btn{
      width:100%;padding:15px;border:none;border-radius:14px;
      font-size:16px;font-weight:900;cursor:pointer;
      font-family:inherit;letter-spacing:0.5px;color:white;
      background:linear-gradient(135deg,#22d3ee,#a78bfa);
      box-shadow:0 6px 20px rgba(34,211,238,0.3);
      transition:all 0.15s;
    }
    .ns-btn:disabled{opacity:0.35;cursor:not-allowed;}
    .ns-btn:active:not(:disabled){transform:scale(0.97);}

    /* Results overlay */
    #resultsOverlay{
      position:fixed;inset:0;display:none;
      align-items:center;justify-content:center;
      z-index:400;
      background:rgba(6,29,44,0.93);
      backdrop-filter:blur(10px);
    }
    #resultsOverlay.show{display:flex;}
    .res-card{
      background:linear-gradient(135deg,#0a2e44,#061d2c);
      border:2px solid rgba(255,255,255,0.1);
      border-radius:28px;padding:24px 20px;
      max-width:360px;width:90%;
      box-shadow:0 20px 60px rgba(0,0,0,0.6);
      text-align:center;max-height:90vh;overflow-y:auto;
    }
    .res-emoji{font-size:60px;margin-bottom:8px;}
    .res-title{font-size:22px;font-weight:900;color:#fbbf24;margin-bottom:6px;}
    .res-score{font-size:48px;font-weight:900;color:#22d3ee;margin:8px 0;text-shadow:0 0 20px rgba(34,211,238,0.4);}
    .res-msg{font-size:13px;color:#7fb3c8;line-height:1.6;margin-bottom:16px;}
    .lb-row{
      display:flex;align-items:center;gap:8px;
      padding:7px 10px;border-radius:10px;
      font-size:12px;margin-bottom:4px;
      background:rgba(255,255,255,0.05);color:#e8f4f8;
    }
    .lb-row.r1{background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.2);}
    .lb-row.r2{background:rgba(192,192,192,0.08);}
    .lb-row.r3{background:rgba(205,127,50,0.08);}
    .lb-row.me{background:rgba(34,211,238,0.08);border:1px solid rgba(34,211,238,0.2);}
    .lb-medal{font-size:16px;width:22px;}
    .lb-name{flex:1;font-weight:700;text-align:left;font-size:12px;}
    .lb-pts{font-weight:900;color:#fbbf24;}
    .res-btn{
      width:100%;padding:13px;border:none;border-radius:13px;
      font-size:14px;font-weight:800;cursor:pointer;
      font-family:inherit;margin-bottom:8px;color:white;
    }
    .res-btn-play{background:linear-gradient(135deg,#22d3ee,#a78bfa);}
    .res-btn-share{background:linear-gradient(135deg,#1877f2,#0d65d9);}
    .res-btn-home{background:rgba(255,255,255,0.08);color:#e8f4f8;}

    /* Confetti */
    .confetti{
      position:fixed;pointer-events:none;z-index:9998;
      animation:confettiFall linear forwards;
    }
    @keyframes confettiFall{
      0%{opacity:1;}
      100%{opacity:0;}
    }

    .mute-btn{
      position:fixed;bottom:16px;right:16px;
      width:42px;height:42px;border-radius:50%;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      font-size:18px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      z-index:100;color:white;
    }
  </style>
</head>
<body>

<!-- Stars background -->
<script>
for(let i=0;i<40;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.cssText=`width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s;`;
  document.body.appendChild(s);
}
</script>

<!-- HUD -->
<div id="hud" style="display:none;">
  <div class="hud-score">🎈 <span id="scoreDisplay">0</span></div>
  <div class="hud-mid">
    <div id="roundTitle" style="font-weight:900;color:#e8f4f8;"></div>
    <div id="poppedDisplay" style="font-size:11px;color:#7fb3c8;"></div>
  </div>
  <div class="hud-timer" id="timerDisplay">30</div>
</div>
<div id="timerBar" style="display:none;"><div id="timerFill" style="width:100%"></div></div>

<!-- Game Canvas -->
<div id="gameCanvas"></div>

<!-- Name Screen -->
<div id="nameScreen">
  <div class="ns-card">
    <div class="ns-logo">🎈</div>
    <div class="ns-title">Aloha Balloons!</div>
    <div class="ns-sub">Pop the balloons floating across the screen! 9 colorful rounds — satisfying ASMR pops for all ages! 🌺</div>
    <input type="text" id="pName" class="ns-input" placeholder="Your name..." maxlength="20">
    <select id="pLoc" class="ns-select">
      <option value="">📍 Where are you from?</option>
      <optgroup label="🌺 Hawaii">
        <option value="Maui, Hawaii">🌺 Maui</option>
        <option value="Oahu, Hawaii">🌊 Oahu</option>
        <option value="Kauai, Hawaii">🌿 Kauai</option>
        <option value="Big Island, Hawaii">🌋 Big Island</option>
        <option value="Molokai, Hawaii">🌴 Molokai</option>
      </optgroup>
      <optgroup label="🇺🇸 USA">
        <option value="California, USA">California</option>
        <option value="New York, USA">New York</option>
        <option value="Texas, USA">Texas</option>
        <option value="Florida, USA">Florida</option>
        <option value="Washington, USA">Washington</option>
        <option value="Other USA">Other USA State</option>
      </optgroup>
      <optgroup label="🌍 World">
        <option value="Australia">🇦🇺 Australia</option>
        <option value="Canada">🇨🇦 Canada</option>
        <option value="Japan">🇯🇵 Japan</option>
        <option value="United Kingdom">🇬🇧 UK</option>
        <option value="Other">🌍 Other Country</option>
      </optgroup>
    </select>
    <button class="ns-btn" id="startBtn" onclick="startGame()" disabled>🎈 Let's Pop!</button>
  </div>
</div>

<!-- Round Announcement -->
<div id="roundAnnounce" class="hidden">
  <div class="announce-emoji" id="announceEmoji">🎈</div>
  <div class="announce-title" id="announceTitle">Pop the Pink Balloons!</div>
  <div class="announce-pts" id="announcePts"></div>
  <div class="announce-sub">30 seconds — how many can you pop?</div>
  <button class="announce-btn" id="announceBtn" onclick="startRound()">🎈 LET'S POP!</button>
</div>

<!-- Results -->
<div id="resultsOverlay">
  <div class="res-card">
    <div class="res-emoji" id="resEmoji">🎈</div>
    <div class="res-title" id="resTitle">Game Over!</div>
    <div class="res-score" id="resScore">0</div>
    <div class="res-msg" id="resMsg"></div>
    <div id="lbList" style="margin-bottom:14px;"></div>
    <button class="res-btn res-btn-share" onclick="shareScore()">📘 Challenge Friends!</button>
    <button class="res-btn res-btn-play" onclick="playAgain()">🎈 Play Again!</button>
    <button class="res-btn res-btn-home" onclick="window.location='/games'">← Games Hub</button>
  </div>
</div>

<button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>

<script>
// ══════════════════════════════════════════
// ALOHA BALLOONS — Today in Hawaii © 2026
// ══════════════════════════════════════════

const ROUNDS = [
  {label:'Pink',   hex:'#FF69B4',shine:'#FFB6C1',dark:'#C2185B',emoji:'🎀',pts:10},
  {label:'Blue',   hex:'#4FC3F7',shine:'#B3E5FC',dark:'#0277BD',emoji:'💙',pts:15},
  {label:'Yellow', hex:'#FFD54F',shine:'#FFF9C4',dark:'#F57F17',emoji:'💛',pts:12},
  {label:'Green',  hex:'#66BB6A',shine:'#C8E6C9',dark:'#2E7D32',emoji:'💚',pts:15},
  {label:'Orange', hex:'#FFA726',shine:'#FFE0B2',dark:'#E65100',emoji:'🧡',pts:18},
  {label:'Purple', hex:'#AB47BC',shine:'#E1BEE7',dark:'#6A1B9A',emoji:'💜',pts:20},
  {label:'Red',    hex:'#EF5350',shine:'#FFCDD2',dark:'#B71C1C',emoji:'❤️', pts:22},
  {label:'Gold',   hex:'#FFD700',shine:'#FFFDE7',dark:'#F57F00',emoji:'⭐',pts:25},
  {label:'Rainbow',hex:'#FF69B4',shine:'#fff',   dark:'#9C27B0',emoji:'🌈',pts:30},
];

const ROUND_TIME=30;
let playerName='',playerLoc='';
let currentRound=0,score=0,totalPopped=0,roundPopped=0;
let timeLeft=ROUND_TIME,timerInterval=null,spawnInterval=null;
let activeBalloons=[],gameActive=false,muted=false,myRank=0;

// ── Name Entry ──────────────────────────
document.getElementById('pName').addEventListener('input',checkReady);
document.getElementById('pLoc').addEventListener('change',checkReady);
function checkReady(){
  const ok=document.getElementById('pName').value.trim().length>=2&&document.getElementById('pLoc').value;
  document.getElementById('startBtn').disabled=!ok;
}

function startGame(){
  playerName=document.getElementById('pName').value.trim();
  playerLoc=document.getElementById('pLoc').value;
  document.getElementById('nameScreen').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('timerBar').style.display='block';
  currentRound=0;score=0;totalPopped=0;
  updateHUD();
  loadLeaderboard();
  showRoundAnnounce();
}

// ── Round Announce ──────────────────────
function showRoundAnnounce(){
  clearBalloons();
  document.getElementById('gameCanvas').classList.remove('active');
  const r=ROUNDS[currentRound];
  document.getElementById('roundAnnounce').classList.remove('hidden');
  document.getElementById('announceEmoji').textContent=r.emoji;
  document.getElementById('announceTitle').textContent='Pop the '+r.label+' Balloons!';
  document.getElementById('announcePts').textContent='Each balloon = '+r.pts+' points!';
  document.getElementById('announcePts').style.color=r.hex;
  document.getElementById('announceBtn').style.background=
    'linear-gradient(135deg,'+r.hex+','+r.dark+')';
}

function startRound(){
  document.getElementById('roundAnnounce').classList.add('hidden');
  document.getElementById('gameCanvas').classList.add('active');
  roundPopped=0;timeLeft=ROUND_TIME;gameActive=true;
  updateHUD();updateTimerBar();
  // Spawn initial balloons
  for(let i=0;i<4;i++) setTimeout(()=>spawnBalloon(),i*300);
  // Keep spawning
  spawnInterval=setInterval(()=>{
    if(!gameActive) return;
    if(activeBalloons.length<10) spawnBalloon();
  },1200);
  // Start timer
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft-=0.1;
    updateTimerBar();
    if(timeLeft<=0){clearInterval(timerInterval);roundOver();}
  },100);
}

// ── Balloon Spawning ────────────────────
function spawnBalloon(){
  if(!gameActive) return;
  const r=ROUNDS[currentRound];
  const canvas=document.getElementById('gameCanvas');
  const W=window.innerWidth, H=window.innerHeight;
  const size=110+Math.random()*70; // 110-180px — BIG!

  // Pick entry direction: top, left, right, bottom
  const side=Math.floor(Math.random()*4); // 0=top 1=right 2=bottom 3=left
  let startX,startY,endX,endY;
  const pad=size;

  if(side===0){ // from top — float DOWN
    startX=Math.random()*(W-size);
    startY=-size;
    endX=startX+(Math.random()-0.5)*200;
    endY=H+size;
  } else if(side===1){ // from right — float LEFT
    startX=W+size;
    startY=Math.random()*(H*0.8)+H*0.1;
    endX=-size;
    endY=startY+(Math.random()-0.5)*200;
  } else if(side===2){ // from bottom — float UP
    startX=Math.random()*(W-size);
    startY=H+size;
    endX=startX+(Math.random()-0.5)*200;
    endY=-size;
  } else { // from left — float RIGHT
    startX=-size;
    startY=Math.random()*(H*0.8)+H*0.1;
    endX=W+size;
    endY=startY+(Math.random()-0.5)*200;
  }

  const dur=12+Math.random()*10; // 12-22 seconds — VERY SLOW
  const wobbleAmt=(Math.random()-0.5)*30;

  const div=document.createElement('div');
  div.className='balloon';
  div.style.cssText=`left:${startX}px;top:${startY}px;width:${size}px;height:${size*1.25}px;`;

  // Balloon SVG
  const isRainbow=r.label==='Rainbow';
  div.innerHTML=buildBalloon(size,r,isRainbow);

  // Points label on balloon
  const ptsEl=document.createElement('div');
  ptsEl.className='balloon-pts';
  ptsEl.textContent=r.pts+' pts';
  ptsEl.style.fontSize=Math.max(12,size*0.14)+'px';
  div.appendChild(ptsEl);

  // Pop on click/touch
  div.addEventListener('click',e=>{e.stopPropagation();popBalloon(div,r,size);});
  div.addEventListener('touchstart',e=>{
    e.preventDefault();e.stopPropagation();
    popBalloon(div,r,size);
  },{passive:false});

  canvas.appendChild(div);
  activeBalloons.push(div);

  // Animate with JS for smooth cross-browser
  const start=Date.now();
  const totalDur=dur*1000;

  function animBalloon(){
    if(!div.isConnected){return;}
    const elapsed=Date.now()-start;
    const progress=elapsed/totalDur;
    if(progress>=1){
      div.remove();
      activeBalloons=activeBalloons.filter(b=>b!==div);
      return;
    }
    // Ease: linear with slight wobble
    const wobble=Math.sin(progress*Math.PI*6)*wobbleAmt;
    const x=startX+(endX-startX)*progress+wobble;
    const y=startY+(endY-startY)*progress;
    // Gentle breathing scale
    const breathe=1+Math.sin(progress*Math.PI*8)*0.03;
    div.style.left=x+'px';
    div.style.top=y+'px';
    div.style.transform=`scale(${breathe})`;
    requestAnimationFrame(animBalloon);
  }
  requestAnimationFrame(animBalloon);
}

// ── Build Balloon SVG ───────────────────
function buildBalloon(size,r,rainbow){
  const w=size,h=size;
  const cx=w/2,cy=h*0.45;
  const rx=w*0.42,ry=h*0.44;
  const id='g'+Math.random().toString(36).substr(2,6);

  let gradDef;
  if(rainbow){
    gradDef=`<radialGradient id="${id}" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#FF69B4"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="75%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#AB47BC"/>
    </radialGradient>`;
  } else {
    gradDef=`<radialGradient id="${id}" cx="35%" cy="28%">
      <stop offset="0%" stop-color="${r.shine}" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="${r.hex}"/>
      <stop offset="100%" stop-color="${r.dark}"/>
    </radialGradient>`;
  }

  const knotY=cy+ry;
  const strPath=`M${cx},${knotY+6} Q${cx-10},${knotY+20} ${cx+5},${knotY+35} Q${cx-5},${knotY+50} ${cx},${knotY+65}`;

  return `<svg viewBox="0 0 ${w} ${h+70}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
    <defs>${gradDef}</defs>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${id})"/>
    <ellipse cx="${cx-rx*0.22}" cy="${cy-ry*0.22}" rx="${rx*0.16}" ry="${ry*0.13}" fill="white" opacity="0.45"/>
    <ellipse cx="${cx+rx*0.15}" cy="${cy-ry*0.35}" rx="${rx*0.07}" ry="${ry*0.06}" fill="white" opacity="0.3"/>
    <polygon points="${cx-5},${knotY} ${cx+5},${knotY} ${cx},${knotY+9}" fill="${r.dark}"/>
    <path d="${strPath}" stroke="${r.dark}" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  </svg>`;
}

// ── Pop Balloon ──────────────────────────
function popBalloon(div,r,size){
  if(!gameActive||!div.isConnected) return;
  activeBalloons=activeBalloons.filter(b=>b!==div);
  const rect=div.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  div.remove();

  // Pop sound!
  playPop(r.pts);
  vibrate(25);

  // Pop ring
  const ring=document.createElement('div');
  ring.className='pop-ring';
  ring.style.cssText=`left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;color:${r.hex};`;
  document.body.appendChild(ring);
  setTimeout(()=>ring.remove(),450);

  // Confetti!
  burst(cx,cy,r.hex,r.dark,r.shine);

  // Score popup
  const pop=document.createElement('div');
  pop.className='score-pop';
  pop.textContent='+'+r.pts+'!';
  pop.style.cssText=`left:${cx}px;top:${cy}px;color:${r.hex};font-size:${Math.max(20,size*0.2)}px;`;
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),950);

  // Update score
  score+=r.pts;
  roundPopped++;
  totalPopped++;
  updateHUD();
}

// ── Confetti Burst ───────────────────────
function burst(cx,cy,hex,dark,shine){
  const colors=[hex,dark,shine,'#ffd700','#fff','#ff6b35'];
  for(let i=0;i<16;i++){
    const c=document.createElement('div');
    c.className='confetti';
    const sz=5+Math.random()*9;
    c.style.cssText=`
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${sz}px;height:${sz}px;
      border-radius:${Math.random()>0.5?'50%':'3px'};
      left:${cx}px;top:${cy}px;
    `;
    document.body.appendChild(c);
    const ang=Math.random()*Math.PI*2;
    const dist=50+Math.random()*100;
    const tx=Math.cos(ang)*dist;
    const ty=Math.sin(ang)*dist;
    const dur=400+Math.random()*400;
    const start=Date.now();
    function animC(){
      const p=Math.min(1,(Date.now()-start)/dur);
      const e=1-Math.pow(1-p,2);
      c.style.transform=`translate(calc(-50% + ${tx*e}px), calc(-50% + ${ty*e + 60*p*p}px)) rotate(${p*540}deg)`;
      c.style.opacity=1-p;
      if(p<1) requestAnimationFrame(animC);
      else c.remove();
    }
    requestAnimationFrame(animC);
  }
}

function clearBalloons(){
  gameActive=false;
  clearInterval(spawnInterval);
  clearInterval(timerInterval);
  activeBalloons.forEach(b=>{if(b.isConnected)b.remove();});
  activeBalloons=[];
  document.getElementById('gameCanvas').innerHTML='';
}

// ── Timer ────────────────────────────────
function updateTimerBar(){
  const pct=Math.max(0,(timeLeft/ROUND_TIME)*100);
  document.getElementById('timerFill').style.width=pct+'%';
  const t=Math.ceil(timeLeft);
  const el=document.getElementById('timerDisplay');
  el.textContent=t;
  el.style.color=t<=10?'#ff4444':'#22d3ee';
  if(t<=10) el.classList.add('urgent');
  else el.classList.remove('urgent');
  if(t<=10&&t>0) vibrate(5);
}

function roundOver(){
  gameActive=false;
  clearInterval(spawnInterval);
  // Pop remaining balloons with celebration
  [...activeBalloons].forEach((b,i)=>{
    setTimeout(()=>{
      if(b.isConnected){
        const rect=b.getBoundingClientRect();
        burst(rect.left+rect.width/2,rect.top+rect.height/2,
          ROUNDS[currentRound].hex,ROUNDS[currentRound].dark,ROUNDS[currentRound].shine);
        b.remove();
      }
    },i*80);
  });
  activeBalloons=[];
  currentRound++;
  if(currentRound>=ROUNDS.length){
    setTimeout(()=>showResults(),1000);
  } else {
    setTimeout(()=>showRoundAnnounce(),900);
  }
}

// ── HUD ───────────────────────────────────
function updateHUD(){
  document.getElementById('scoreDisplay').textContent=score.toLocaleString();
  const r=ROUNDS[Math.min(currentRound,ROUNDS.length-1)];
  document.getElementById('roundTitle').textContent=
    r.emoji+' '+r.label+' Balloons — Round '+(currentRound+1)+'/'+ROUNDS.length;
  document.getElementById('poppedDisplay').textContent=
    '💥 '+roundPopped+' this round · '+totalPopped+' total popped';
}

// ── Results ───────────────────────────────
async function showResults(){
  clearBalloons();
  await submitScore();
  await loadLeaderboard();
  const msgs=[
    'You\'re a balloon popping legend!! 🎈',
    'So satisfying!! Come back tomorrow! 🌺',
    'Mahalo for playing — so relaxing! 🤙',
    'The grandkids won\'t beat THAT score! 😄',
  ];
  document.getElementById('resEmoji').textContent=score>1000?'🏆':score>500?'🎈':'🌺';
  document.getElementById('resTitle').textContent=score>1000?'BALLOON CHAMPION!!':'Great Popping!!';
  document.getElementById('resScore').textContent=score.toLocaleString()+' pts';
  document.getElementById('resMsg').textContent=
    '💥 Popped '+totalPopped+' balloons across all 9 rounds! '+
    msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('resultsOverlay').classList.add('show');
}

function playAgain(){
  document.getElementById('resultsOverlay').classList.remove('show');
  currentRound=0;score=0;totalPopped=0;roundPopped=0;
  updateHUD();showRoundAnnounce();
}

function shareScore(){
  const txt='🎈 I popped '+totalPopped+' balloons and scored '+score.toLocaleString()+' pts on Aloha Balloons from '+playerLoc+'! Can you beat me? 🌺 todayinhawaii.com/balloons';
  window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent('https://www.todayinhawaii.com/balloons')+'&quote='+encodeURIComponent(txt),'_blank');
}

// ── ASMR Pop Sound ────────────────────────
let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}

function playPop(pts){
  if(muted) return;
  try{
    const c=getAudio();
    const buf=c.createBuffer(1,c.sampleRate*0.18,c.sampleRate);
    const d=buf.getChannelData(0);
    // Satisfying balloon pop — sharp attack, quick airy decay
    for(let i=0;i<d.length;i++){
      const t=i/c.sampleRate;
      const env=Math.exp(-t*35);
      const env2=Math.exp(-t*120);
      const freq=180+pts*4+Math.random()*40;
      d[i]=env*(Math.sin(2*Math.PI*freq*t)*0.7+
                Math.sin(2*Math.PI*freq*2.1*t)*0.2)+
           env2*(Math.random()*2-1)*0.5;
    }
    const src=c.createBufferSource();
    const gain=c.createGain();
    src.connect(gain);gain.connect(c.destination);
    src.buffer=buf;gain.gain.value=0.7;
    src.start();
  }catch(e){}
}

function toggleMute(){muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';}
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

// ── Leaderboard ───────────────────────────
async function loadLeaderboard(){
  try{
    const res=await fetch('/api/balloon-scores');
    const data=await res.json();
    const medals=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
    if(!data.length){
      document.getElementById('lbList').innerHTML='<div style="text-align:center;color:#7fb3c8;font-size:13px;padding:10px;">Be the first balloon champion! 🎈</div>';
      return;
    }
    document.getElementById('lbList').innerHTML=data.slice(0,6).map((s,i)=>{
      const isMe=playerName&&s.name.toLowerCase()===playerName.toLowerCase();
      const cls=i===0?'r1':i===1?'r2':i===2?'r3':isMe?'me':'';
      return `<div class="lb-row ${cls}">
        <span class="lb-medal">${medals[i]||i+1}</span>
        <div style="flex:1">
          <div class="lb-name">${s.name}${isMe?' ← You!':''}</div>
          <div style="font-size:10px;color:#7fb3c8;">📍 ${s.island} · 💥 ${s.level} popped</div>
        </div>
        <span class="lb-pts">${Number(s.score).toLocaleString()}</span>
      </div>`;
    }).join('');
  }catch(e){}
}

async function submitScore(){
  if(!playerName||score<=0) return;
  try{
    const res=await fetch('/api/balloon-scores',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:playerName,score,island:playerLoc,level:totalPopped})
    });
    const data=await res.json();
    if(data.ok) myRank=data.rank;
  }catch(e){}
}

loadLeaderboard();
</script>
