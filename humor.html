    body{

      background:#0a0a00;overflow-x:hidden;overflow-y:auto;color:#e8f4f8;
    }

    #funBg{
      position:fixed;inset:0;z-index:0;
      background:radial-gradient(ellipse at 50% 0%,#1a1a00 0%,#0a0a00 70%);
      overflow:hidden;
    }
    .confetti-bg{
      position:absolute;font-size:20px;
      animation:confettiBob ease-in-out infinite;
      opacity:0.15;
    }
    @keyframes confettiBob{
      0%,100%{transform:translateY(0) rotate(0deg);}
      50%{transform:translateY(-15px) rotate(15deg);}
    }

    .wrap{
      position:relative;z-index:1;
      max-width:480px;margin:0 auto;
      padding:16px 16px 60px;
      display:flex;flex-direction:column;align-items:center;

    /* Header */
    .hdr{text-align:center;padding:10px 0 14px;}
    .hdr-emoji{
      font-size:60px;display:block;margin-bottom:6px;
      animation:laughBob 1s ease-in-out infinite alternate;
    }
    @keyframes laughBob{
      0%{transform:scale(1) rotate(-5deg);}
      100%{transform:scale(1.12) rotate(5deg);}
    }
    .hdr-title{
      font-size:28px;font-weight:900;letter-spacing:-0.5px;

    @keyframes titleRainbow{

    }
    .hdr-sub{font-size:13px;color:#a0a000;margin-top:4px;font-style:italic;}

      position:relative;
      width:min(340px,90vw);height:min(340px,90vw);
      margin:10px auto 14px;
    }
    .wheel-outer{
      position:absolute;inset:-8px;border-radius:50%;
      background:conic-gradient(#ff0080,#ff8c00,#ffd700,#00ff80,#00d4ff,#ff0080,#ff8c00,#ffd700,#00ff80,#00d4ff,#ff0080);

    }
    @keyframes outerSpin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

      position:absolute;inset:8px;border-radius:50%;

      box-shadow:0 0 24px rgba(255,140,0,0.5),0 0 50px rgba(255,0,128,0.2),inset 0 0 30px rgba(0,0,0,0.5);
      overflow:hidden;cursor:pointer;will-change:transform;
    }
    #wheel canvas{width:100%;height:100%;display:block;}
    .wheel-center{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:52px;height:52px;border-radius:50%;
      background:radial-gradient(circle,#ffd700,#ff8c00,#ff0000);
      border:3px solid #ffd700;
      box-shadow:0 0 18px rgba(255,215,0,0.9),0 0 36px rgba(255,140,0,0.5);
      display:flex;align-items:center;justify-content:center;
      font-size:22px;z-index:5;
      animation:jokePulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes jokePulse{
      0%{transform:translate(-50%,-50%) scale(1);}
      100%{transform:translate(-50%,-50%) scale(1.15);}
    }
    .wheel-pointer{
      position:absolute;top:-4px;left:50%;transform:translateX(-50%);
      width:0;height:0;
      border-left:14px solid transparent;
      border-right:14px solid transparent;
      border-top:40px solid #ffd700;
      filter:drop-shadow(0 0 8px rgba(255,215,0,0.9));
      z-index:10;

    .history-wrap{width:min(400px,92vw);margin-bottom:16px;}

    .share-btn:active{transform:scale(0.97);}

    .spin-count{font-size:11px;color:#666;text-align:center;margin-bottom:10px;}
    .confetti{position:fixed;pointer-events:none;z-index:999;}
    .back{text-align:center;margin-top:16px;font-size:13px;color:#666;}
    .back a{color:#ff8c00;text-decoration:none;font-weight:600;}

// Build funny background
function buildBackground(){
  const bg = document.getElementById('funBg');
  const emojis = ['😂','🤣','😆','😜','🎰','🎪','😎','💀','😤','🤪'];
  for(let i=0;i<20;i++){
    const p = document.createElement('div');
    p.className = 'confetti-bg';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${3+Math.random()*5}s;animation-delay:${Math.random()*5}s;font-size:${18+Math.random()*20}px;`;

// Draw wheel

  const canvas = document.getElementById('wheelCanvas');
  const size = canvas.parentElement.offsetWidth;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size/2, cy = size/2, r = size/2 - 2;
  const slice = (Math.PI*2) / NUM_SEGMENTS;

  JOKES.forEach((j, i) => {
    const startAngle = i * slice - Math.PI/2;
    const endAngle = startAngle + slice;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = i%2===0 ? j.color : adjustColor(j.color,-25);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Icon
    const midAngle = startAngle + slice/2;
    const lx = cx + Math.cos(midAngle) * r * 0.72;
    const ly = cy + Math.sin(midAngle) * r * 0.72;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(midAngle + Math.PI/2);
    ctx.font = `${Math.max(9,size*0.026)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(j.icon, 0, 0);
    ctx.restore();
  });

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, r*0.18, 0, Math.PI*2);
  ctx.fillStyle = '#0a0a00';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,0,0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function adjustColor(hex, amount){
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (num>>16) + amount));
  const g = Math.min(255, Math.max(0, ((num>>8)&0xff) + amount));
  const b = Math.min(255, Math.max(0, (num&0xff) + amount));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function spinWheel(){
  if(spinning) return;
  spinning = true;
  spinCount++;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('spinBtn').classList.remove('glowing');
  document.getElementById('shareBtn').classList.remove('show');
  document.getElementById('jokeText').innerHTML = '<span style="font-size:28px;animation:emojiWiggle 0.3s ease-in-out infinite alternate;">🎰</span>';
  document.getElementById('jokeBox').classList.remove('revealed');
  document.getElementById('jokeCat').classList.remove('show');
  document.getElementById('jokeEmoji').classList.remove('show');
  document.getElementById('jokeBar').classList.remove('show');

  playSpinSound();

  const extraSpins = 5 + Math.random() * 5;
  const targetRotation = currentAngle + extraSpins * 360 + Math.random() * 360;
  const slice = 360 / NUM_SEGMENTS;
  const normalizedAngle = ((targetRotation % 360) + 360) % 360;
  const jokeIdx = Math.floor(((360 - normalizedAngle) % 360) / slice) % NUM_SEGMENTS;

  const duration = 4000 + Math.random() * 2000;
  const startTime = Date.now();
  const startAngle = currentAngle;

  function animSpin(){
    const elapsed = Date.now() - startTime;
    const progress = Math.min(1, elapsed/duration);
    const ease = 1 - Math.pow(1-progress, 3);
    const angle = startAngle + (targetRotation-startAngle)*ease;

    const prev = Math.floor((currentAngle%360)/slice);
    const curr = Math.floor((angle%360)/slice);
    if(prev!==curr) playTickSound();

    document.getElementById('wheel').style.transform = `rotate(${angle}deg)`;
    currentAngle = angle;

    if(progress < 1){
      requestAnimationFrame(animSpin);
    } else {
      currentAngle = targetRotation;
      spinning = false;
      revealJoke(jokeIdx);
    }
  }
  requestAnimationFrame(animSpin);
}

function revealJoke(idx){
  const joke = JOKES[idx];
  currentJoke = joke;

  setTimeout(()=>{
    const box = document.getElementById('jokeBox');
    box.classList.add('revealed');
    box.style.borderTopColor = joke.color;
    box.style.borderBottomColor = joke.color;
    box.style.boxShadow = `0 -8px 0 rgba(150,100,0,0.6),0 8px 0 rgba(150,100,0,0.6),0 0 40px ${joke.color}33,inset 0 0 40px rgba(0,0,0,0.4)`;

    // Category
    const cat = document.getElementById('jokeCat');
    cat.textContent = joke.icon + ' ' + joke.cat;
    cat.style.background = joke.color + '22';
    cat.style.border = `1px solid ${joke.color}66`;
    cat.style.color = joke.color;
    cat.classList.add('show');

    // Emoji
    const emojiEl = document.getElementById('jokeEmoji');
    emojiEl.textContent = joke.icon;
    emojiEl.classList.add('show');

    // Typewriter
    const textEl = document.getElementById('jokeText');
    textEl.innerHTML = '';
    textEl.style.color = '#ffe066';
    let i = 0;
    const txt = joke.text;
    function typeNext(){
      if(i < txt.length){
        textEl.innerHTML = '"' + txt.slice(0,i+1) + (i<txt.length-1?'|':'') + '"';
        i++;
        setTimeout(typeNext, 35);
      } else {
        textEl.innerHTML = '"' + txt + '"';
        const bar = document.getElementById('jokeBar');
        bar.style.background = joke.color;
        bar.style.boxShadow = `0 0 8px ${joke.color}`;
        bar.classList.add('show');
        document.getElementById('shareBtn').classList.add('show');
        document.getElementById('spinBtn').disabled = false;
        document.getElementById('spinBtn').classList.add('glowing');
        laughCelebrate(joke.color);
        playRevealSound();
      }
    }
    setTimeout(typeNext, 200);

    jokeHistory.unshift(joke);
    if(jokeHistory.length > 5) jokeHistory.pop();
    updateHistory();

    const msgs = [
      '😂 Getting warmed up!',
      '🔥 The roast continues!',
      '💀 You asked for it!',
      '😂 Spin again for more!',
      '🎰 The wheel never lies!',
    ];
    document.getElementById('spinCount').textContent =
      'Roast #' + spinCount + ' · ' + msgs[Math.min(spinCount-1, msgs.length-1)];
  }, 500);
}

function updateHistory(){
  const list = document.getElementById('historyList');
  const title = document.getElementById('historyTitle');
  title.style.display = jokeHistory.length > 1 ? 'block' : 'none';
  list.innerHTML = jokeHistory.slice(1).map(j=>`
    <div class="history-item">
      <div class="history-dot" style="background:${j.color};box-shadow:0 0 4px ${j.color};"></div>
      <span>${j.icon} ${j.text}</span>
    </div>
  `).join('');
}

function shareJoke(){
  if(!currentJoke) return;
  const txt = `😂 My Humour Roulette reading: "${currentJoke.text}" 🎰 What does YOUR wheel say? todayinhawaii.com/humor`;
  window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent('https://www.todayinhawaii.com/humor')+'&quote='+encodeURIComponent(txt),'_blank');
}

// Laugh celebration
function laughCelebrate(color){
  const emojis = ['😂','🤣','😆','💀','😜','🎉','🔥'];
  for(let i=0;i<20;i++){
    const p = document.createElement('div');
    p.className='confetti';
    const isEmoji = Math.random()>0.5;
    if(isEmoji){
      p.style.cssText=`font-size:${16+Math.random()*16}px;left:${10+Math.random()*80}%;top:${15+Math.random()*35}%;`;
      p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    } else {
      p.style.cssText=`background:${color};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'3px'};left:${10+Math.random()*80}%;top:${15+Math.random()*35}%;`;
    }
    document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2, dist=50+Math.random()*120;
    const tx=Math.cos(ang)*dist, ty=Math.sin(ang)*dist;
    const dur=500+Math.random()*700, start=Date.now();
    function animC(){
      const pr=Math.min(1,(Date.now()-start)/dur);
      const e=1-Math.pow(1-pr,2);
      p.style.transform=`translate(calc(-50% + ${tx*e}px),calc(-50% + ${ty*e+100*pr*pr}px)) rotate(${pr*720}deg)`;
      p.style.opacity=1-pr;
      if(pr<1) requestAnimationFrame(animC);
      else p.remove();
    }
    requestAnimationFrame(animC);
  }
}

// Sounds
let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(f,t,v,d,delay){
  try{
    const c=getAudio(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=t;o.frequency.value=f;delay=delay||0;
    g.gain.setValueAtTime(0,c.currentTime+delay);
    g.gain.linearRampToValueAtTime(v,c.currentTime+delay+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+delay+d);
    o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+0.05);
  }catch(e){}
}
function playTickSound(){playTone(600+Math.random()*300,'square',0.06,0.03);}
function playSpinSound(){playTone(150,'sawtooth',0.1,0.3);}
function playRevealSound(){
  // Wah wah wah — comedy trombone!
  [466,440,415,392].forEach((f,i)=>playTone(f,'sawtooth',0.35,0.25,i*0.12));
  setTimeout(()=>{
    [523,659,784].forEach((f,i)=>playTone(f,'sine',0.3,0.2,i*0.08));
  },600);
}

buildBackground();
drawWheel();
window.addEventListener('resize', drawWheel);
