<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧪 The Slime Factory — Today in Hawaii</title>
  <meta name="description" content="Make your own slime! Real pliable physics — push pull squish stretch! ASMR fun for kids!">
  <link rel="icon" href="/icon-192.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;
      font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;}

    /* Header */
    #hdr{
      position:fixed;top:0;left:0;right:0;height:52px;
      padding:0 12px;z-index:50;
      display:flex;align-items:center;justify-content:space-between;
      background:rgba(13,17,23,0.92);backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .hdr-left{display:flex;flex-direction:column;}
    .hdr-title{
      font-size:15px;font-weight:900;letter-spacing:0.5px;
      background:linear-gradient(90deg,#00ff88,#00ccff,#ff00ff,#00ff88);
      background-size:200% auto;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      animation:shimmer 3s linear infinite;
    }
    @keyframes shimmer{0%{background-position:0% center;}100%{background-position:200% center;}}
    .hdr-hint{font-size:9px;color:#444;margin-top:1px;}
    .mute-btn{
      width:34px;height:34px;border-radius:50%;
      background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);
      font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;
    }

    /* Main canvas — fills everything below header */
    #slimeCanvas{
      position:fixed;top:52px;left:0;right:0;
      bottom:170px;
      width:100%;touch-action:none;cursor:crosshair;
      display:block;
    }

    /* Bottom shelf */
    #shelf{
      position:fixed;bottom:0;left:0;right:0;height:168px;
      background:rgba(13,17,23,0.97);
      border-top:1px solid rgba(255,255,255,0.07);
      padding:8px 10px 10px;z-index:50;
      display:flex;flex-direction:column;gap:5px;
    }
    .shelf-section{display:flex;flex-direction:column;gap:3px;}
    .shelf-label{font-size:8px;font-weight:800;color:#444;text-transform:uppercase;letter-spacing:0.15em;}
    .shelf-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
    .shelf-row::-webkit-scrollbar{display:none;}

    .ing-btn{
      flex-shrink:0;width:46px;height:46px;border-radius:12px;
      border:1.5px solid rgba(255,255,255,0.08);cursor:pointer;
      font-size:18px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:1px;
      transition:all 0.12s;background:rgba(255,255,255,0.05);
      position:relative;
    }
    .ing-btn:active{transform:scale(0.85);}
    .ing-btn.active{
      border-color:rgba(255,255,255,0.5);
      box-shadow:0 0 12px rgba(255,255,255,0.25);
      transform:scale(1.06);
    }
    .ing-name{font-size:6px;color:rgba(255,255,255,0.5);font-weight:700;letter-spacing:0.03em;}

    /* Action row */
    .action-row{display:flex;gap:6px;margin-top:2px;}
    .act-btn{
      flex:1;padding:8px 4px;border:none;border-radius:10px;
      font-size:11px;font-weight:800;cursor:pointer;
      font-family:inherit;color:#fff;transition:all 0.1s;
      white-space:nowrap;
    }
    .act-btn:active{transform:scale(0.94);}
    .btn-squish{background:linear-gradient(135deg,#059669,#0891b2);}
    .btn-mix{background:linear-gradient(135deg,#7c3aed,#db2777);}
    .btn-reset{background:rgba(255,255,255,0.07);color:#888;}
    .btn-save{background:linear-gradient(135deg,#d97706,#dc2626);}

    /* Toast */
    .toast{
      position:fixed;top:62px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,0.85);color:white;padding:6px 16px;
      border-radius:99px;font-size:12px;font-weight:700;
      z-index:200;animation:toastAnim 2s ease forwards;white-space:nowrap;
      pointer-events:none;
    }
    @keyframes toastAnim{
      0%{opacity:0;transform:translate(-50%,-8px);}
      15%{opacity:1;transform:translate(-50%,0);}
      75%{opacity:1;}
      100%{opacity:0;transform:translate(-50%,-8px);}
    }
  </style>

<body>

<div id="hdr">
  <div class="hdr-left">
    <div class="hdr-title">🧪 THE SLIME FACTORY</div>
    <div class="hdr-hint">👆 Push · Pull · Stretch · Drag · Circle!</div>
  </div>
  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
</div>

<canvas id="slimeCanvas"></canvas>

<div id="shelf">
  <div class="shelf-section">
    <div class="shelf-label">🎨 Colors</div>
    <div class="shelf-row" id="colorRow"></div>
  </div>
  <div class="shelf-section">
    <div class="shelf-label">✨ Add-ins</div>
    <div class="shelf-row" id="addinsRow"></div>
  </div>
  <div class="action-row">
    <button class="act-btn btn-squish" onclick="doSquish()">👆 SQUISH</button>
    <button class="act-btn btn-mix"    onclick="doMix()">🌀 MIX</button>
    <button class="act-btn btn-save"   onclick="doSave()">📸 SAVE</button>
    <button class="act-btn btn-reset"  onclick="doReset()">🗑️ RESET</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// THE SLIME FACTORY — Real Soft-Body Physics
// Today in Hawaii © 2026
// ══════════════════════════════════════════════

const canvas  = document.getElementById('slimeCanvas');
const ctx     = canvas.getContext('2d');

let W, H, CX, CY, NATURAL_R;

function setSize(){
  const rect = canvas.getBoundingClientRect();
  W = canvas.width  = rect.width  * window.devicePixelRatio;
  H = canvas.height = rect.height * window.devicePixelRatio;
  canvas.style.width  = rect.width  + 'px';
  canvas.style.height = rect.height + 'px';
  CX = W/2; CY = H/2;
  NATURAL_R = Math.min(W, H) * 0.38;
}
setSize();

// ── PHYSICS CONFIG ─────────────────────────────
const N           = 48;
const STIFFNESS   = 0.0008;  // almost ZERO spring back — stays where pushed!
const NEIGHBOR_K  = 0.012;   // barely any neighbor pull — totally gooey
const PRESSURE_K  = 0.0006;  // almost no pressure — dead heavy clay
const DAMPING     = 0.64;    // very HIGH damping — motion dies instantly!
const FINGER_R    = NATURAL_R * 0.62;
const FINGER_F    = 1.2;     // slow heavy resistance

// ── SLIME STATE ───────────────────────────────
let pts = [];    // boundary points: {x,y,vx,vy}
let naturalPts = []; // rest positions

function initSlime(){
  pts = [];
  naturalPts = [];
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2;
    const x = CX + Math.cos(a)*NATURAL_R;
    const y = CY + Math.sin(a)*NATURAL_R;
    pts.push({x,y,vx:0,vy:0});
    naturalPts.push({x,y});
  }
}

function recalcNatural(){
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2;
    naturalPts[i].x = CX + Math.cos(a)*NATURAL_R;
    naturalPts[i].y = CY + Math.sin(a)*NATURAL_R;
  }
}

// ── PARTICLES (add-ins) ────────────────────────
let blobs = []; // {x,y,vx,vy,emoji,color,size,rot,rotV}

function addDecorBlobs(type, count){
  for(let k=0;k<count;k++){
    const a = Math.random()*Math.PI*2;
    const r = NATURAL_R*(0.1+Math.random()*0.7);
    const b = {
      x: CX+Math.cos(a)*r, y: CY+Math.sin(a)*r,
      vx:(Math.random()-0.5)*0.6, vy:(Math.random()-0.5)*0.6,
      rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.04,
      type, size:0, emoji:'', color:'',
    };
    switch(type){
      case 'glitter': b.color=`hsl(${Math.random()*360},100%,70%)`; b.size=2+Math.random()*3; break;
      case 'stars':   b.emoji='⭐'; b.size=10+Math.random()*8; break;
      case 'sprinkles': b.color=`hsl(${Math.random()*360},90%,60%)`; b.size=3+Math.random()*3; b.shape='rect'; break;
      case 'sparkles': b.emoji='✨'; b.size=11+Math.random()*7; break;
      case 'foam':    b.color=`rgba(255,255,255,${0.3+Math.random()*0.4})`; b.size=7+Math.random()*10; break;
      case 'hearts':  b.emoji='💕'; b.size=11+Math.random()*8; break;
      case 'candy':   b.color=`hsl(${Math.random()*360},90%,65%)`; b.size=6+Math.random()*5; break;
      case 'confetti': b.color=`hsl(${Math.random()*360},95%,60%)`; b.size=5+Math.random()*5; b.shape='rect'; break;
      case 'pearls':  b.color=`rgba(240,240,255,0.85)`; b.size=7+Math.random()*5; break;
      case 'ice':     b.color=`rgba(180,220,255,0.6)`; b.size=6+Math.random()*7; break;
      case 'beads':   b.color=`hsl(${Math.random()*360},80%,65%)`; b.size=6+Math.random()*4; break;
      case 'glow':    b.color=`hsl(${160+Math.random()*80},100%,65%)`; b.size=5+Math.random()*5; break;
    }
    blobs.push(b);
  }
}

// ── COLOR STATE ───────────────────────────────
let slimeR=0, slimeG=200, slimeB=80;
let isRainbow = false;
let rainbowHue = 0;
let activeAddins = new Set();

// ── FINGER TRACKING ────────────────────────────
let fingers = {}; // pointerId -> {x,y,prevX,prevY}

canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const pos = getPos(e);
  fingers[e.pointerId] = {...pos, prevX:pos.x, prevY:pos.y};
  canvas.setPointerCapture(e.pointerId);
  playTouch();
});

canvas.addEventListener('pointermove', e=>{
  e.preventDefault();
  if(!fingers[e.pointerId]) return;
  const prev = fingers[e.pointerId];
  const pos  = getPos(e);
  const dx = pos.x - prev.x;
  const dy = pos.y - prev.y;
  applyFingerForce(pos.x, pos.y, dx, dy);
  fingers[e.pointerId] = {...pos, prevX:prev.x, prevY:prev.y};
  playStretch(Math.sqrt(dx*dx+dy*dy));

  // Move internal blobs with finger too
  moveBlobs(pos.x, pos.y, dx*0.3, dy*0.3);
});

canvas.addEventListener('pointerup',   e=>{ delete fingers[e.pointerId]; playRelease(); });
canvas.addEventListener('pointercancel',e=>{ delete fingers[e.pointerId]; });

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const pr = window.devicePixelRatio;
  return {
    x: (e.clientX - rect.left)  * pr,
    y: (e.clientY - rect.top)   * pr,
  };
}

// ── APPLY FINGER FORCE to boundary points ──────
function applyFingerForce(fx, fy, dx, dy){
  const speed = Math.sqrt(dx*dx+dy*dy);
  if(speed<0.5) return;

  pts.forEach((p,i)=>{
    const ex = p.x - fx;
    const ey = p.y - fy;
    const dist = Math.sqrt(ex*ex+ey*ey);

    if(dist < FINGER_R * 1.4){
      // Influence falls off with distance — closer = stronger
      const influence = Math.max(0, 1 - dist/(FINGER_R*1.4));
      const smoothInf  = influence * influence; // smooth falloff

      // Direct push — boundary points move WITH finger direction
      p.vx += dx * FINGER_F * smoothInf;
      p.vy += dy * FINGER_F * smoothInf;
    }
  });
}

function moveBlobs(fx, fy, dx, dy){
  blobs.forEach(b=>{
    const ex = b.x-fx, ey = b.y-fy;
    const dist = Math.sqrt(ex*ex+ey*ey);
    if(dist < FINGER_R){
      const inf = Math.max(0,1-dist/FINGER_R);
      b.vx += dx*inf*1.5;
      b.vy += dy*inf*1.5;
    }
  });
}

// ── PHYSICS STEP ───────────────────────────────
function calcArea(){
  let area=0;
  for(let i=0;i<N;i++){
    const j=(i+1)%N;
    area += pts[i].x*pts[j].y - pts[j].x*pts[i].y;
  }
  return Math.abs(area)*0.5;
}

const NATURAL_AREA = Math.PI * NATURAL_R * NATURAL_R;

function updatePhysics(){
  const area = calcArea();
  const pressureError = (area - NATURAL_AREA) / NATURAL_AREA;

  for(let i=0;i<N;i++){
    const p    = pts[i];
    const prev = pts[(i-1+N)%N];
    const next = pts[(i+1)%N];
    const nat  = naturalPts[i];

    let fx=0, fy=0;

    // 1. Spring back to natural position (keeps overall shape)
    fx += (nat.x - p.x) * STIFFNESS;
    fy += (nat.y - p.y) * STIFFNESS;

    // 2. Spring to neighbors (keeps surface smooth and connected)
    const natDist = NATURAL_R * (2*Math.PI/N); // natural distance between neighbors
    function springNeighbor(other){
      const dx = other.x-p.x, dy = other.y-p.y;
      const dist = Math.sqrt(dx*dx+dy*dy)||1;
      const stretch = dist - natDist;
      fx += (dx/dist)*stretch*NEIGHBOR_K;
      fy += (dy/dist)*stretch*NEIGHBOR_K;
    }
    springNeighbor(prev);
    springNeighbor(next);

    // 3. Pressure — pushes outward when squeezed, inward when stretched
    // Normal direction = outward from center
    const nx = p.x-CX, ny = p.y-CY;
    const nl = Math.sqrt(nx*nx+ny*ny)||1;
    fx -= (nx/nl) * pressureError * PRESSURE_K * NATURAL_R;
    fy -= (ny/nl) * pressureError * PRESSURE_K * NATURAL_R;

    // Apply forces to velocity
    p.vx += fx;
    p.vy += fy;

    // Damping — this is what makes it feel like slime not rubber!
    p.vx *= DAMPING;
    p.vy *= DAMPING;

    // Integrate position
    p.x += p.vx;
    p.y += p.vy;
  }

  // Update blobs (internal particles)
  blobs.forEach(b=>{
    b.x  += b.vx;
    b.y  += b.vy;
    b.vx *= 0.97;
    b.vy *= 0.97;
    b.rot += b.rotV;

    // Keep blobs inside the slime using boundary
    // Simple: if outside the natural circle, pull back
    const bx=b.x-CX, by=b.y-CY;
    const bd=Math.sqrt(bx*bx+by*by);
    if(bd > NATURAL_R*0.88){
      b.vx -= (bx/bd)*0.4;
      b.vy -= (by/bd)*0.4;
    }
  });
}

// ── DRAW ──────────────────────────────────────
function drawSlime(){
  ctx.clearRect(0,0,W,H);

  if(isRainbow) rainbowHue=(rainbowHue+0.6)%360;

  // Build smooth closed curve through boundary points
  ctx.beginPath();
  for(let i=0;i<N;i++){
    const a = pts[i];
    const b = pts[(i+1)%N];
    const c = pts[(i+2)%N];
    // Catmull-Rom control points via midpoints
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const nx = (b.x+c.x)/2, ny = (b.y+c.y)/2;
    if(i===0) ctx.moveTo(mx,my);
    ctx.quadraticCurveTo(b.x,b.y,nx,ny);
  }
  ctx.closePath();

  // Fill gradient
  const grad = ctx.createRadialGradient(
    CX - NATURAL_R*0.22, CY - NATURAL_R*0.22, 0,
    CX, CY, NATURAL_R*1.15
  );

  let r=slimeR,g=slimeG,b=slimeB;
  if(isRainbow){
    const h=rainbowHue;
    const [r1,g1,b1] = hslToRgb(h/360,1,0.72);
    const [r2,g2,b2] = hslToRgb(((h+100)%360)/360,1,0.5);
    const [r3,g3,b3] = hslToRgb(((h+200)%360)/360,1,0.38);
    grad.addColorStop(0,  `rgba(${r1},${g1},${b1},0.93)`);
    grad.addColorStop(0.5,`rgba(${r2},${g2},${b2},0.95)`);
    grad.addColorStop(1,  `rgba(${r3},${g3},${b3},0.97)`);
  } else {
    grad.addColorStop(0,  `rgba(${Math.min(255,r+90)},${Math.min(255,g+90)},${Math.min(255,b+90)},0.92)`);
    grad.addColorStop(0.45,`rgba(${r},${g},${b},0.95)`);
    grad.addColorStop(1,  `rgba(${Math.max(0,r-70)},${Math.max(0,g-70)},${Math.max(0,b-70)},0.98)`);
  }

  // Glow shadow
  ctx.shadowColor = isRainbow ? `hsl(${rainbowHue},100%,60%)` : `rgba(${r},${g},${b},0.8)`;
  ctx.shadowBlur  = 30;
  ctx.fillStyle   = grad;
  ctx.fill();
  ctx.shadowBlur  = 0;

  // Clip for inner content
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<N;i++){
    const a=pts[i], b2=pts[(i+1)%N], c=pts[(i+2)%N];
    const mx=(a.x+b2.x)/2, my=(a.y+b2.y)/2;
    const nx=(b2.x+c.x)/2, ny=(b2.y+c.y)/2;
    if(i===0) ctx.moveTo(mx,my);
    ctx.quadraticCurveTo(b2.x,b2.y,nx,ny);
  }
  ctx.closePath();
  ctx.clip();

  // Main shine highlight (top-left)
  const shine1 = ctx.createRadialGradient(
    CX-NATURAL_R*0.28, CY-NATURAL_R*0.3, 0,
    CX-NATURAL_R*0.28, CY-NATURAL_R*0.28, NATURAL_R*0.55
  );
  shine1.addColorStop(0,'rgba(255,255,255,0.42)');
  shine1.addColorStop(0.5,'rgba(255,255,255,0.1)');
  shine1.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = shine1;
  ctx.fillRect(0,0,W,H);

  // Secondary small highlight
  const shine2 = ctx.createRadialGradient(
    CX+NATURAL_R*0.22, CY+NATURAL_R*0.15, 0,
    CX+NATURAL_R*0.22, CY+NATURAL_R*0.15, NATURAL_R*0.18
  );
  shine2.addColorStop(0,'rgba(255,255,255,0.2)');
  shine2.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = shine2;
  ctx.fillRect(0,0,W,H);

  // Draw particles
  blobs.forEach(b=>{
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.globalAlpha = 0.85;
    if(b.emoji){
      ctx.font = `${b.size*window.devicePixelRatio*0.7}px system-ui`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.emoji,0,0);
    } else if(b.shape==='rect'){
      ctx.fillStyle=b.color;
      ctx.fillRect(-b.size/2,-b.size*0.25,b.size,b.size*0.5);
    } else {
      ctx.fillStyle=b.color;
      ctx.shadowColor=b.color; ctx.shadowBlur=b.size*0.6;
      ctx.beginPath(); ctx.arc(0,0,b.size/2,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });

  ctx.restore(); // end clip

  // Rim highlight (thin bright edge)
  ctx.beginPath();
  for(let i=0;i<N;i++){
    const a=pts[i], b2=pts[(i+1)%N], c=pts[(i+2)%N];
    const mx=(a.x+b2.x)/2, my=(a.y+b2.y)/2;
    const nx=(b2.x+c.x)/2, ny=(b2.y+c.y)/2;
    if(i===0) ctx.moveTo(mx,my);
    ctx.quadraticCurveTo(b2.x,b2.y,nx,ny);
  }
  ctx.closePath();
  ctx.strokeStyle = isRainbow?`hsla(${(rainbowHue+60)%360},100%,80%,0.4)`:`rgba(${Math.min(255,r+120)},${Math.min(255,g+120)},${Math.min(255,b+120)},0.35)`;
  ctx.lineWidth   = 2.5;
  ctx.stroke();

  // Finger contact feedback
  Object.values(fingers).forEach(f=>{
    const gr = ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,NATURAL_R*0.18);
    gr.addColorStop(0,'rgba(255,255,255,0.18)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gr;
    ctx.beginPath();
    ctx.arc(f.x,f.y,NATURAL_R*0.18,0,Math.PI*2);
    ctx.fill();
  });
}

// ── MAIN LOOP ────────────────────────────────
function loop(){
  updatePhysics();
  drawSlime();
  requestAnimationFrame(loop);
}

// ── COLOR & ADD-INS SETUP ─────────────────────
const COLORS = [
  {label:'Green',   icon:'🟢', r:0,   g:200, b:80 },
  {label:'Purple',  icon:'🟣', r:160, g:32,  b:240},
  {label:'Pink',    icon:'🩷', r:255, g:80,  b:180},
  {label:'Blue',    icon:'🔵', r:30,  g:140, b:255},
  {label:'Orange',  icon:'🟠', r:255, g:130, b:0  },
  {label:'Red',     icon:'🔴', r:220, g:30,  b:30 },
  {label:'Yellow',  icon:'🟡', r:240, g:210, b:0  },
  {label:'White',   icon:'⚪', r:230, g:230, b:240},
  {label:'Teal',    icon:'🫐', r:0,   g:195, b:175},
  {label:'Gold',    icon:'🌕', r:255, g:195, b:40 },
  {label:'Black',   icon:'⚫', r:25,  g:25,  b:35 },
  {label:'Rainbow', icon:'🌈', r:-1,  g:-1,  b:-1 },
];

const ADDINS = [
  {icon:'✨',name:'Glitter',  effect:'glitter'},
  {icon:'⭐',name:'Stars',    effect:'stars'},
  {icon:'🎊',name:'Sprinkles',effect:'sprinkles'},
  {icon:'💫',name:'Sparkles', effect:'sparkles'},
  {icon:'🫧',name:'Foam',     effect:'foam'},
  {icon:'💕',name:'Hearts',   effect:'hearts'},
  {icon:'🍬',name:'Candy',    effect:'candy'},
  {icon:'🎉',name:'Confetti', effect:'confetti'},
  {icon:'🫧',name:'Pearls',   effect:'pearls'},
  {icon:'❄️', name:'Ice',      effect:'ice'},
  {icon:'🫧',name:'Beads',    effect:'beads'},
  {icon:'🌟',name:'Glow',     effect:'glow'},
];

function buildUI(){
  const cr=document.getElementById('colorRow');
  COLORS.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='ing-btn';
    btn.innerHTML=`<span>${c.icon}</span><span class="ing-name">${c.label}</span>`;
    if(c.r===-1) btn.style.background='linear-gradient(135deg,#ff0080,#ffcc00,#00ff88,#00ccff,#ff00ff)';
    else{ btn.style.background=`rgba(${c.r},${c.g},${c.b},0.25)`; btn.style.borderColor=`rgba(${c.r},${c.g},${c.b},0.5)`;}
    btn.onclick=()=>{
      document.querySelectorAll('#colorRow .ing-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      if(c.r===-1){ isRainbow=true; showToast('🌈 RAINBOW SLIME!! 🌈'); }
      else{ isRainbow=false; slimeR=c.r; slimeG=c.g; slimeB=c.b; showToast(`${c.icon} ${c.label} slime!`); }
      playPop(600); splatColor(c);
    };
    cr.appendChild(btn);
  });

  const ar=document.getElementById('addinsRow');
  ADDINS.forEach(a=>{
    const btn=document.createElement('button');
    btn.className='ing-btn';
    btn.innerHTML=`<span>${a.icon}</span><span class="ing-name">${a.name}</span>`;
    btn.onclick=()=>{
      if(activeAddins.has(a.effect)){
        activeAddins.delete(a.effect);
        blobs=blobs.filter(b=>b.type!==a.effect);
        btn.classList.remove('active');
        showToast(`Removed ${a.icon}`);
      } else {
        activeAddins.add(a.effect);
        btn.classList.add('active');
        addDecorBlobs(a.effect,22);
        showToast(`${a.icon} ${a.name} added!`);
        playPop(700+Math.random()*200);
        vibrate(15);
      }
    };
    ar.appendChild(btn);
  });
}

function splatColor(c){
  // Quick visual ripple when color changes
  for(let i=0;i<N;i++) pts[i].vr = 0;
  pts.forEach(p=>{
    const dx=p.x-CX,dy=p.y-CY,d=Math.sqrt(dx*dx+dy*dy)||1;
    p.vx+=(dx/d)*3; p.vy+=(dy/d)*3;
  });
  setTimeout(()=>pts.forEach(p=>{
    const dx=p.x-CX,dy=p.y-CY,d=Math.sqrt(dx*dx+dy*dy)||1;
    p.vx-=(dx/d)*2; p.vy-=(dy/d)*2;
  }),120);
}

// ── ACTION BUTTONS ────────────────────────────
function doSquish(){
  // Push all points inward then release — big satisfying splat
  pts.forEach(p=>{
    const dx=p.x-CX,dy=p.y-CY,d=Math.sqrt(dx*dx+dy*dy)||1;
    p.vx -= (dx/d)*18; p.vy -= (dy/d)*18;
  });
  setTimeout(()=>pts.forEach(p=>{
    const dx=p.x-CX,dy=p.y-CY,d=Math.sqrt(dx*dx+dy*dy)||1;
    p.vx += (dx/d)*22; p.vy += (dy/d)*22;
  }),160);
  activeAddins.forEach(a=>addDecorBlobs(a,8));
  playSquish(); vibrate([25,10,25]);
  showToast('💦 SQUISH!!');
}

function doMix(){
  // Spin the slime!
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2;
    const tangX=-Math.sin(a), tangY=Math.cos(a);
    pts[i].vx+=tangX*16; pts[i].vy+=tangY*16;
  }
  activeAddins.forEach(a=>addDecorBlobs(a,6));
  playMix(); vibrate([10,5,10,5,20]);
  showToast('🌀 Mixing!');
}

function doSave(){
  const tmp=document.createElement('canvas');
  tmp.width=canvas.width; tmp.height=canvas.height;
  tmp.getContext('2d').drawImage(canvas,0,0);
  const link=document.createElement('a');
  link.download='my-slime.png'; link.href=tmp.toDataURL('image/png'); link.click();
  showToast('📸 Saved! Share with friends!');
  playPop(1000); vibrate([30,20,30]);
}

function doReset(){
  blobs=[]; activeAddins.clear();
  document.querySelectorAll('.ing-btn').forEach(b=>b.classList.remove('active'));
  slimeR=0; slimeG=200; slimeB=80; isRainbow=false;
  initSlime(); playPop(400);
  showToast('🗑️ Fresh slime! Start again!');
}

// ── TOAST ──────────────────────────────────────
function showToast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

// ── SOUND — Wet Slimy Water Sounds ─────────────
// Real slime sounds = short wet transient clicks
// NOT sustained noise (that = wind/blowing!)
// Think: fingers through honey, pulling wet clay apart
let ac=null; let muted=false;
function ga(){
  if(!ac) ac=new(window.AudioContext||window.webkitAudioContext)();
  return ac;
}

// Make a short wet squelch burst
// Key: bandpass 300-900Hz, very short, slight reverb tail
function wetSquelch(vol, pitch, dur){
  if(muted) return;
  try{
    const c = ga();
    const sr = c.sampleRate;
    const len = Math.floor(sr * dur);
    const buf = c.createBuffer(1, len, sr);
    const d   = buf.getChannelData(0);

    // Short burst of white noise shaped like a wet click
    for(let i=0;i<len;i++){
      const t = i/sr;
      // Fast attack (1ms), medium decay — wet transient shape
      const env = Math.exp(-t * (8/dur));
      d[i] = (Math.random()*2-1) * env;
    }

    const src = c.createBufferSource();
    src.buffer = buf;

    // Bandpass filter — this is the key!
    // Wet/slimy sounds live in 300-900Hz range
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 350 + pitch * 200; // 350-750Hz
    bp.Q.value = 1.8; // focused wet sound

    // Second bandpass layer for richness
    const bp2 = c.createBiquadFilter();
    bp2.type = 'bandpass';
    bp2.frequency.value = 600 + pitch * 150;
    bp2.Q.value = 2.5;

    const gain = c.createGain();
    gain.gain.value = vol;

    src.connect(bp);
    bp.connect(bp2);
    bp2.connect(gain);
    gain.connect(c.destination);
    src.start();
  }catch(e){}
}

// Multiple rapid wet clicks — like fingers through slime
function wetClicks(vol, count, pitchBase){
  if(muted) return;
  try{
    const c = ga();
    for(let i=0;i<count;i++){
      setTimeout(()=>{
        wetSquelch(vol*(0.7+Math.random()*0.6), pitchBase+Math.random()*0.5, 0.06+Math.random()*0.06);
      }, i * (18+Math.random()*12));
    }
  }catch(e){}
}

// Watery shlorp — suction pulling through liquid
function wateryShlorp(vol, dur){
  if(muted) return;
  try{
    const c = ga();
    const sr = c.sampleRate;
    const len = Math.floor(sr * dur);
    const buf = c.createBuffer(1, len, sr);
    const d   = buf.getChannelData(0);

    for(let i=0;i<len;i++){
      const t = i/sr;
      // Envelope: quick rise, slow wet tail
      const rise = Math.min(t/(dur*0.08), 1);
      const fall = Math.exp(-t*(3/dur));
      const env  = rise * fall;
      // Noise + very subtle low wobble for the "wet body"
      const wobble = Math.sin(2*Math.PI*180*t) * 0.08;
      d[i] = ((Math.random()*2-1)*0.9 + wobble) * env;
    }

    const src = c.createBufferSource();
    src.buffer = buf;

    // Wider bandpass for bigger wet sound
    const bp = c.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.value=450; bp.Q.value=1.4;

    const gain = c.createGain();
    gain.gain.value = vol;

    src.connect(bp); bp.connect(gain); gain.connect(c.destination);
    src.start();
  }catch(e){}
}

function playTouch(){
  if(muted) return;
  // 2-3 short wet clicks — finger pressing into slime
  wetClicks(0.5, 2+Math.floor(Math.random()*2), 0.3);
}

let lastSnd=0;
function playStretch(speed){
  if(muted||speed<1.5) return;
  const now=Date.now();
  if(now-lastSnd<90) return;
  lastSnd=now;
  // Single soft wet squelch as finger drags
  wetSquelch(0.28, 0.4+Math.random()*0.4, 0.07);
}

function playRelease(){
  if(muted) return;
  // Soft wet release — slime letting go
  wetSquelch(0.32, 0.2, 0.1);
  setTimeout(()=>wetSquelch(0.15, 0.1, 0.08), 60);
}

function playSquish(){
  if(muted) return;
  // Big satisfying wet squish — several clicks + shlorp
  wateryShlorp(0.65, 0.22);
  wetClicks(0.4, 4, 0.5);
}

function playMix(){
  if(muted) return;
  // Mixing = rapid wet clicks like stirring slime
  for(let i=0;i<6;i++){
    setTimeout(()=>{
      wateryShlorp(0.35, 0.12);
    }, i*90);
  }
  wetClicks(0.3, 8, 0.4);
}

function playPop(freq){
  // Soft wet plop — not a tone, just a click
  if(muted) return;
  wetClicks(0.35, 1, 0.5);
}

function toggleMute(){muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';}
function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

// ── UTILS ─────────────────────────────────────
function hslToRgb(h,s,l){
  let r,g,b;
  if(s===0){r=g=b=l;}
  else{
    const q=l<0.5?l*(1+s):l+s-l*s,p=2*l-q;
    function hue(h){h=(h%1+1)%1;if(h<1/6)return p+(q-p)*6*h;if(h<1/2)return q;if(h<2/3)return p+(q-p)*(2/3-h)*6;return p;}
    r=hue(h+1/3);g=hue(h);b=hue(h-1/3);
  }
  return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
}

window.addEventListener('resize',()=>{
  setSize();
  recalcNatural();
  initSlime();
});

buildUI();
initSlime();
loop();
showToast('👆 Push and stretch the slime with your fingers!');
