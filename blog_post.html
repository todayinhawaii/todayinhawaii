<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Blog Post | Today in Hawaii</title>
<meta name="description" id="pageMeta" content="">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Today in Hawaii">
<meta property="og:title" id="ogTitle" content="">
<meta property="og:description" id="ogDesc" content="">
<meta property="og:image" id="ogImage" content="">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q7H0QG9BBG"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-Q7H0QG9BBG");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--deep:#061d2c;--wave:#0e7490;--foam:#22d3ee;--coral:#f97316;--gold:#fbbf24;--green:#10b981;--text:#e8f4f8;--muted:#7fb3c8;--card-bg:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"DM Sans",sans-serif;background:var(--deep);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(14,116,144,0.25),transparent 60%),linear-gradient(180deg,#061d2c,#0a2e44 50%,#061d2c);z-index:0;pointer-events:none;}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 24px;}
.narrow{max-width:740px;margin:0 auto;}
header{padding:32px 0 0;}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#0e7490,#22d3ee);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.logo-text{font-family:"Playfair Display",serif;font-size:22px;font-weight:700;color:var(--text);}
.logo-text span{color:var(--foam);}
.nav-wrapper{padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.desktop-nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.nav-link{display:flex;align-items:center;gap:4px;padding:7px 11px;border-radius:99px;font-size:12px;font-weight:500;text-decoration:none;border:1px solid var(--border);color:var(--muted);background:var(--card-bg);transition:all 0.15s;white-space:nowrap;}
.nav-link:hover,.nav-link.active{border-color:rgba(255,255,255,0.6);color:#fff;background:rgba(255,255,255,0.15);}
@media(max-width:900px){.desktop-nav{flex-wrap:wrap;gap:6px;padding:8px;}.nav-link{font-size:11px;padding:6px 10px;}}

/* HERO */
.post-hero{padding:48px 0 0;animation:fadeIn 0.7s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.post-tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--foam);background:rgba(34,211,238,0.12);border:1px solid rgba(34,211,238,0.25);border-radius:99px;padding:4px 14px;margin-bottom:18px;}
.post-title{font-family:"Playfair Display",serif;font-size:clamp(32px,5vw,62px);font-weight:900;line-height:1.1;color:#fff;margin-bottom:20px;}
.post-meta-bar{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--muted);margin-bottom:36px;flex-wrap:wrap;}
.post-meta-bar span{display:flex;align-items:center;gap:5px;}
.post-hero-img{width:100%;border-radius:20px;max-height:500px;object-fit:cover;margin-bottom:48px;animation:imgReveal 0.8s ease 0.2s both;}
.post-hero-placeholder{width:100%;height:320px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:48px;animation:imgReveal 0.8s ease 0.2s both;}
@keyframes imgReveal{from{opacity:0;transform:scale(0.98);}to{opacity:1;transform:scale(1);}}

/* CONTENT */
.post-content{font-family:"DM Sans",sans-serif;font-size:17px;line-height:1.85;color:#d4eaf5;animation:fadeIn 0.8s ease 0.3s both;}
.post-content h2{font-family:"Playfair Display",serif;font-size:28px;font-weight:700;color:#fff;margin:44px 0 18px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.post-content h3{font-family:"Playfair Display",serif;font-size:22px;font-weight:700;color:var(--foam);margin:32px 0 14px;}
.post-content p{margin-bottom:22px;}
.post-content strong{color:#fff;font-weight:600;}
.post-content em{color:var(--foam);font-style:italic;}
.post-content a{color:var(--foam);text-decoration:underline;}
.post-content ul,.post-content ol{margin:0 0 22px 24px;}
.post-content li{margin-bottom:8px;}
.post-content img{width:100%;border-radius:14px;margin:24px 0;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.post-content blockquote{border-left:3px solid var(--foam);padding:12px 20px;background:rgba(34,211,238,0.06);border-radius:0 10px 10px 0;margin:24px 0;font-style:italic;color:var(--muted);}
.post-content .tip-box{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);border-radius:12px;padding:16px 20px;margin:24px 0;color:#e8f4f8;}

/* BACK + SHARE */
.post-footer{padding:48px 0 32px;border-top:1px solid var(--border);margin-top:56px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.back-link{color:var(--foam);text-decoration:none;font-size:14px;display:flex;align-items:center;gap:6px;}
.share-btns{display:flex;gap:10px;}
.share-btn{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--border);color:var(--muted);background:var(--card-bg);cursor:pointer;font-family:inherit;transition:all 0.15s;}
.share-btn:hover{border-color:var(--foam);color:var(--foam);}

/* RELATED */
.related-section{padding:48px 0;border-top:1px solid var(--border);}
.related-title{font-family:"Playfair Display",serif;font-size:24px;font-weight:700;margin-bottom:24px;}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
.related-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;overflow:hidden;text-decoration:none;display:block;transition:transform 0.2s,border-color 0.2s;}
.related-card:hover{transform:translateY(-3px);border-color:rgba(34,211,238,0.3);}
.related-img{width:100%;height:140px;object-fit:cover;}
.related-placeholder{width:100%;height:140px;display:flex;align-items:center;justify-content:center;font-size:40px;}
.related-body{padding:16px;}
.related-body h4{font-family:"Playfair Display",serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.3;}
.related-body p{font-size:12px;color:var(--muted);}

.not-found{text-align:center;padding:100px 24px;}
.not-found .emoji{font-size:64px;margin-bottom:20px;display:block;}
footer{border-top:1px solid var(--border);padding:32px 0;text-align:center;font-size:13px;color:var(--muted);line-height:1.8;}
footer a{color:var(--foam);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/" class="logo">
      <div class="logo-icon">🌊</div>
      <div class="logo-text">Today in <span>Hawaiʻi</span></div>
    </a>
  </header>
  <nav>
    <div class="nav-wrapper">
      <div class="desktop-nav">
        <a href="/" class="nav-link">🌺 Home</a>
        <a href="/oahu" class="nav-link">🌆 Oahu</a>
        <a href="/maui" class="nav-link">🏄 Maui</a>
        <a href="/kauai" class="nav-link">🌿 Kauaʻi</a>
        <a href="/bigisland" class="nav-link">🌋 Big Island</a>
        <a href="/hiking" class="nav-link">🥾 Hiking</a>
        <a href="/beaches" class="nav-link">🏖️ Beaches</a>
        <a href="/food" class="nav-link">🍽️ Food</a>
        <a href="/blog" class="nav-link active">✍️ Blog</a>
        <a href="/about" class="nav-link">☀️ About</a>
      </div>
    </div>
  </nav>
  <div id="postContainer"></div>
</div>
<footer>
  <div class="wrap">
    <p><a href="/blog">← Back to Blog</a> · <a href="/">Today in Hawaiʻi</a></p>
    <p style="margin-top:6px;">Today in Hawaiʻi — Not affiliated with the State of Hawaii</p>
  </div>
</footer>
<script>
function timeAgo(d){const s=Math.floor((Date.now()-new Date(d))/1000);if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hrs ago';if(s<604800)return Math.floor(s/86400)+' days ago';return new Date(d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}
function readTime(c){return Math.max(1,Math.ceil(c.replace(/<[^>]+>/g,'').split(/\s+/).length/200))+' min read';}

async function loadPost(){
  const slug = window.location.pathname.split('/').pop();
  try{
    const r = await fetch('/blog/post/'+slug);
    if(!r.ok)throw new Error('Not found');
    const post = await r.json();

    // SEO
    document.getElementById('pageTitle').textContent = post.title + ' | Today in Hawaii';
    document.getElementById('pageMeta').content = post.meta || post.excerpt || '';
    document.getElementById('ogTitle').content = post.title;
    document.getElementById('ogDesc').content = post.meta || post.excerpt || '';
    if(post.image) document.getElementById('ogImage').content = post.image.startsWith('data:')?'':post.image;

    // Render
    const imgHtml = post.image
      ? `<img src="${post.image}" alt="${post.title}" class="post-hero-img">`
      : `<div class="post-hero-placeholder" style="background:linear-gradient(135deg,${post.color||'#0e7490'},#061d2c)">${post.emoji||'🌺'}</div>`;

    document.getElementById('postContainer').innerHTML = `
      <div class="post-hero narrow">
        <span class="post-tag">${post.tag||'Hawaii'}</span>
        <h1 class="post-title">${post.title}</h1>
        <div class="post-meta-bar">
          <span>✍️ ${post.author||'Today in Hawaii'}</span>
          <span>📅 ${timeAgo(post.date)}</span>
          <span>⏱ ${readTime(post.content)}</span>
        </div>
      </div>
      <div class="narrow">${imgHtml}</div>
      <div class="post-content narrow">${post.content}</div>
      <div class="post-footer narrow">
        <a href="/blog" class="back-link">← Back to Blog</a>
        <div class="share-btns">
          <button class="share-btn" onclick="navigator.share?navigator.share({title:'${post.title.replace(/'/g,"\'")}',url:location.href}):navigator.clipboard.writeText(location.href).then(()=>alert('Link copied!'))">Share 🔗</button>
        </div>
      </div>`;

    // Related posts
    try{
      const all = await fetch('/blog/posts').then(r=>r.json());
      const related = all.filter(p=>p.slug!==slug&&p.status==='published').slice(0,3);
      if(related.length>0){
        const relHtml = `<div class="related-section narrow">
          <div class="related-title">More from the Blog 🌺</div>
          <div class="related-grid">${related.map(p=>`
            <a href="/blog/${p.slug}" class="related-card">
              ${p.image?`<img src="${p.image}" alt="${p.title}" class="related-img">`:`<div class="related-placeholder" style="background:linear-gradient(135deg,${p.color||'#0e7490'},#061d2c)">${p.emoji||'🌺'}</div>`}
              <div class="related-body">
                <h4>${p.title}</h4>
                <p>${p.tag} · ${readTime(p.content)}</p>
              </div>
            </a>`).join('')}
          </div>
        </div>`;
        document.getElementById('postContainer').insertAdjacentHTML('beforeend', relHtml);
      }
    }catch(e){}
  } catch(e){
    document.getElementById('postContainer').innerHTML = `<div class="not-found"><span class="emoji">🌊</span><h2 style="font-family:Playfair Display,serif;font-size:32px;margin-bottom:12px;">Post not found</h2><p style="color:var(--muted)"><a href="/blog" style="color:var(--foam)">← Back to blog</a></p></div>`;
  }
}
loadPost();
</script>
</body>
</html>
